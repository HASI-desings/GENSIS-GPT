<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07070b"><link rel="manifest" href="manifest.webmanifest"><title>GENESIS — AI Civilization Simulator</title><style>:root{--bg:#07070b;--p:#0e0c14dd;--l:#ffffff18;--t:#f7f5fb;--m:#aaa6b5;--a:#a855f7}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font:12px system-ui,-apple-system,sans-serif}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.panel{pointer-events:auto;background:linear-gradient(180deg,#15121ddd,#09080ddd);border:1px solid var(--l);backdrop-filter:blur(14px);border-radius:14px;box-shadow:0 14px 40px #0006}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.brand{padding:9px 12px}.brand b{letter-spacing:.16em}.brand small{display:block;color:var(--m);font-size:9px;margin-top:2px}.buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.btn{min-height:40px;padding:8px 11px;border:1px solid var(--l);border-radius:9px;background:#16131dcc;color:var(--t);font-weight:700;cursor:pointer}.btn.active,.btn:hover{background:#7c3aaa55;border-color:#a855f799}.stats{position:absolute;left:12px;top:78px;width:250px;padding:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.stat{padding:8px;border:1px solid #ffffff0c;border-radius:9px;background:#ffffff06}.stat b{font-size:16px}.stat small{display:block;color:var(--m);font-size:9px}.meter{height:3px;background:#27232f;border-radius:3px;margin-top:5px}.meter i{display:block;height:100%;width:50%;background:var(--a);border-radius:3px}.side{position:absolute;right:12px;top:78px;width:270px;max-height:calc(100vh - 155px);overflow:auto;padding:11px}.side h4{margin:0 0 7px;font-size:10px;letter-spacing:.1em}.box{padding:9px;border:1px solid #ffffff12;border-radius:9px;background:#ffff </style></head><body><div id="app"></div><div class="hud"><div class="top"><div class="brand panel"><b>GENESIS</b><small>AI CIVILIZATION SIMULATOR</small></div><div class="buttons"><button class="btn active" data-v="top">CITY</button><button class="btn" data-v="third">THIRD</button><button class="btn" data-v="first">FIRST</button><button class="btn" id="pause">PAUSE</button></div></div><div class="stats panel"><div class="grid"><div class="stat"><b id="pop">100</b><small>POPULATION</small></div><div class="stat"><b id="day">1.0</b><small>DAY</small></div><div class="stat"><b id="food">78%</b><small>FOOD</small><div class="meter"><i id="fb"></i></div></div><div class="stat"><b id="water">84%</b><small>WATER</small><div class="meter"><i id="wb"></i></div></div><div class="stat"><b id="pluto">91%</b><small>PLUTO</small><div class="meter"><i id="pb"></i></div></div><div class="stat"><b id="mood">72%</b><small>AVG MOOD</small><div class="meter"><i id="mb"></i></div></div></div><div style="margin-top:8px;color:var(--m);font-size:9px">65 male · 35 female · live simulation</div></div><aside class="side panel"><h4>CITIZEN INSPECTOR</h4><div class="box" id="inspect">Tap a citizen.</div><h4 style="margin-top:12px">LIVE FEED</h4><div id="events"></div></aside><div class="bottom"><div class="hint panel desktop">CITY: drag/zoom · T third · F first · C city · WASD move selected</div><div class="status panel" id="status">CITY VIEW</div></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/+esm","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{SkeletonUtils}from'three/addons/utils/SkeletonUtils.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,300),r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;$('app').append(r.domElement);scene.background=new THREE.Color(0x08090c);scene.fog=new THREE.Fog(0x08090c,80,180);scene.add(new THREE.HemisphereLight(0xc8d2ff,0x30291f,2));let sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(35,75,25);scene.add(sun);let g=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x5e744e,roughness:1}));g.rotation.x=-Math.PI/2;scene.add(g);scene.add(new THREE.GridHelper(150,30,0x53684a,0x4a5b43));
function b(x,z,w,d,h,c){let q=new THREE.Group(),m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.9}));m.position.y=h/2;q.add(m);let roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,Math.max(2,w*.25),4),new THREE.MeshStandardMaterial({color:0x49364f}));roof.position.y=h+.8;roof.rotation.y=Math.PI/4;q.add(roof);q.position.set(x,0,z);scene.add(q)}for(let i=0;i<30;i++)b((i%7-3)*14+(Math.random()*4-2),(Math.floor(i/7)-2)*13+(Math.random()*4-2),6+Math.random()*3,6+Math.random()*3,4+Math.random()*5,[0xb98d6a,0x8998ad,0xa07fa4,0x78956e][i%4]);b(38,-34,9,8,7,0x6d4c87);b(-31,-32,9,8,8,0xb7c0c7);b(28,32,10,8,7,0xd1b071);let pond=new THREE.Mesh(new THREE.CylinderGeometry(12,12,.3,48),new THREE.MeshStandardMaterial({color:0x3e8fa5,roughness:.3}));pond.position.set(-48,.15,-35);scene.add(pond);
const names=['Ari','Mika','Noah','Lina','Zara','Adam','Maya','Leo','Sara','Omar','Nia','Eli','Raya','Iris','Sam','Kai','Luca','Ava','Milo','Nora'],jobs=['Farmer','Water Keeper','Pluto Technician','Doctor','Barber','Teacher','Guard','Politician','Businessman','Unemployed'],cs=[],loader=new GLTFLoader();let male,anim,clips={},selected=null,mode='top',paused=false,day=1,food=78,water=84,pluto=91;
const CHAR='https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb',ANIM='https://raw.githubusercontent.com/J-Ponzo/gltf-universal-animation-library/main/glTF/AnimationLibrary_Godot_Standard.gltf';
async function boot(){try{let[a,z]=await Promise.all([loader.loadAsync(CHAR),loader.loadAsync(ANIM)]);male=a.scene;z.animations.forEach(x=>clips[x.name]=x);for(let i=0;i<100;i++)spawn(i);select(cs[0]);log('100 citizens entered the world')}catch(e){console.error(e);for(let i=0;i<100;i++)fallback(i);select(cs[0]);log('3D fallback active — simulation remains playable')}}
function spawn(i){let m=SkeletonUtils.clone(male);m.scale.setScalar(.68);m.position.set((Math.random()-.5)*90,0,(Math.random()-.5)*70);m.userData={id:i,name:names[i%names.length]+' '+(i+1),gender:i<65?'Male':'Female',job:jobs[i%jobs.length],health:70+Math.random()*30,mood:45+Math.random()*55,hunger:50+Math.random()*50,thirst:50+Math.random()*50,wealth:20+Math.random()*500,age:18+Math.random()*60,target:new THREE.Vector3()};m.userData.target.copy(m.position).add(new THREE.Vector3((Math.random()-.5)*20,0,(Math.random()-.5)*20));scene.add(m);let mix=new THREE.AnimationMixer(m),clip=clips.Walk_Loop||clips.Walk_Formal_Loop;if(clip)mix.clipAction(clip).play();cs.push({m,mix})}
function fallback(i){let m=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:i<65?0x68789f:0xb76d88}),body=new THREE.Mesh(new THREE.CapsuleGeometry(.35,.8,3,8),mat),head=new THREE.Mesh(new THREE.SphereGeometry(.35,8,6),mat);body.position.y=.8;head.position.y=1.65;m.add(body,head);m.position.set((Math.random()-.5)*90,0,(Math.random()-.5)*70);m.userData={id:i,name:names[i%names.length]+' '+(i+1),gender:i<65?'Male':'Female',job:jobs[i%jobs.length],health:70+Math.random()*30,mood:50+Math.random()*50,hunger:50,thirst:50,wealth:100,age:20+Math.random()*50,target:new THREE.Vector3()};m.userData.target.copy(m.position);scene.add(m);cs.push({m,mix:null})}
function select(c){selected=c;if(!c)return;let d=c.m.userData;$('inspect').innerHTML='<b>'+d.name+'</b><div class="row"><span>'+d.gender+' · '+Math.round(d.age)+' yrs</span><b>'+d.job+'</b></div><div class="row"><span>Health</span><b>'+Math.round(d.health)+'%</b></div><div class="row"><span>Mood</span><b>'+Math.round(d.mood)+'%</b></div><div class="row"><span>Wealth</span><b>$'+Math.round(d.wealth)+'</b></div><div class="row"><span>Hunger / Thirst</span><b>'+Math.round(d.hunger)+' / '+Math.round(d.thirst)+'</b></div>';if(mode!='top')$('status').textContent=mode.toUpperCase()+' · '+d.name}
function log(s){let e=document.createElement('div');e.className='event';e.textContent='Day '+day.toFixed(1)+' · '+s;$('events').prepend(e);while($('events').children.length>9)$('events').lastChild.remove()}
const orbit=new OrbitControls(cam,r.domElement);orbit.enableDamping=true;orbit.dampingFactor=.08;orbit.maxPolarAngle=Math.PI*.49;orbit.maxDistance=145;cam.position.set(0,78,78);orbit.target.set(0,0,0);const ray=new THREE.Raycaster(),p=new THREE.Vector2();r.domElement.addEventListener('pointerdown',e=>{p.x=e.clientX/innerWidth*2-1;p.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(p,cam);let hit=ray.intersectObjects(cs.map(c=>c.m),true)[0];if(hit){let o=hit.object;while(o.parent&&!o.userData.id)o=o.parent;let c=cs.find(x=>x.m===o);if(c)select(c)}});
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='t')view('third');if(e.key.toLowerCase()==='f')view('first');if(e.key.toLowerCase()==='c')view('top');if(e.code==='Space'){$('pause').click()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);document.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>view(x.dataset.v));$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE'};
function view(v){mode=v;document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===v));orbit.enabled=v==='top';if(!selected)select(cs[0]);if(v==='top'){cam.position.set(0,78,78);orbit.target.set(0,0,0);$('status').textContent='CITY VIEW · 100 CITIZENS'}else $('status').textContent=v.toUpperCase()+' · '+selected.m.userData.name;cam.fov=58;cam.updateProjectionMatrix()}
function player(dt){if(!selected||mode==='top')return;let m=selected.m,d=new THREE.Vector3((keys.d?1:0)-(keys.a?1:0),0,(keys.s?1:0)-(keys.w?1:0));if(d.lengthSq()){d.normalize().multiplyScalar(dt*11);m.position.add(d);m.rotation.y=Math.atan2(d.x,d.z)}m.position.x=THREE.MathUtils.clamp(m.position.x,-72,72);m.position.z=THREE.MathUtils.clamp(m.position.z,-65,65);if(mode==='third'){let off=new THREE.Vector3(0,5,8).applyAxisAngle(new THREE.Vector3(0,1,0),m.rotation.y);cam.position.lerp(m.position.clone().add(off),.12);cam.lookAt(m.position.x,m.position.y+1,m.position.z)}else{let eye=m.position.clone().add(new THREE.Vector3(0,1.55,0));cam.position.lerp(eye,.4);cam.lookAt(eye.x+Math.sin(m.rotation.y),eye.y,eye.z+Math.cos(m.rotation.y))}}
function sim(dt){day+=dt*.09;food=Math.max(0,food-dt*.55);water=Math.max(0,water-dt*.42);pluto=Math.max(0,pluto-dt*.3);if(food<25)food+=dt*.18;if(water<25)water+=dt*.15;if(pluto<25)pluto+=dt*.1;cs.forEach((c,i)=>{let d=c.m.userData;d.hunger=Math.max(0,d.hunger-dt);d.thirst=Math.max(0,d.thirst-dt*.8);d.mood=THREE.MathUtils.clamp(d.mood+dt*((food+water+pluto)/300-.45)*4,0,100);if(c.mix)c.mix.update(dt);if(i%3){let v=d.target.clone().sub(c.m.position);v.y=0;if(v.length()<2)d.target.set(THREE.MathUtils.clamp(c.m.position.x+(Math.random()-.5)*20,-65,65),0,THREE.MathUtils.clamp(c.m.position.z+(Math.random()-.5)*18,-58,58));else{v.normalize().multiplyScalar(dt*1.8);c.m.position.add(v);c.m.rotation.y=Math.atan2(v.x,v.z)}}});if(Math.random()<dt*.15)log(['a new job was accepted','two citizens became friends','a citizen visited the clinic','farmers harvested food','a guard stopped a theft','a new romance was reported'][Math.floor(Math.random()*6)])}
let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){sim(dt);player(dt);let mood=cs.reduce((s,c)=>s+c.m.userData.mood,0)/cs.length;$('day').textContent=day.toFixed(1);$('food').textContent=Math.round(food)+'%';$('water').textContent=Math.round(water)+'%';$('pluto').textContent=Math.round(pluto)+'%';$('mood').textContent=Math.round(mood)+'%';$('fb').style.width=food+'%';$('wb').style.width=water+'%';$('pb').style.width=pluto+'%';$('mb').style.width=mood+'%'}if(mode==='top')orbit.update();r.render(scene,cam)}boot();loop(performance.now());addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5))});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
